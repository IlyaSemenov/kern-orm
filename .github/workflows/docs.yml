name: Docs

# Publishes the docs of the last release at the root of the site and the docs of `main` under dev/.
# A run derives both from the current state of the repository, so any run can replace a queued one, and a rerun neither rolls back the site nor needs to know what is deployed.

on:
  push:
    branches: [main]
  release:
    types: [released]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Starts this workflow on `main` rather than deploying from here: a release event runs on the ref of the tag, which the github-pages environment does not allow to deploy and which the cache of `main` does not cover.
  # A dispatch is the event of `GITHUB_TOKEN` that does start a workflow.
  dispatch:
    name: Dispatch
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Start the workflow on main
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The tip of the branch rather than the commit of the event, so that a rerun does not roll back Dev.
          ref: ${{ github.ref }}
          # VitePress takes last updated times from the Git history.
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.20

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Find the last release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # Any package counts, and a batch of releases shares one commit.
        # The list goes from the newest tag, whereas GitHub marks as latest only some of the releases.
        run: |
          tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          commit=$(git rev-parse "refs/tags/$tag^{commit}")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Build Dev
        run: bun run docs:build
        env:
          DOCS_TRACK: dev

      - name: Restore Release
        id: release-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/release
          key: docs-release-${{ steps.release.outputs.commit }}

      # Builds with the tools and dependencies of the release, which main may have moved past.
      - name: Build Release
        if: steps.release-cache.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ runner.temp }}
        run: |
          git worktree add "$RUNNER_TEMP/release-source" "$COMMIT"
          cd "$RUNNER_TEMP/release-source"
          mise exec -- bun install --frozen-lockfile
          mise exec -- bun run docs:build
          mv docs/.vitepress/dist "$RUNNER_TEMP/release"

      - name: Assemble the site
        run: |
          cp -R "$RUNNER_TEMP/release" "$RUNNER_TEMP/site"
          mv docs/.vitepress/dist "$RUNNER_TEMP/site/dev"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  # A run on another branch tests the build.
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
