name: Test

on:
  push:
    branches: ["**"]
  pull_request:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    # A release commit only versions a commit whose CI the release has waited for.
    # A skipped job satisfies required status checks, unlike a skipped workflow.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    # A test whose promise never settles under `expect(...).rejects` hangs `bun test` instead of timing out.
    timeout-minutes: 15

    services:
      postgres:
        # PostgreSQL with the pgvector extension, which the tests of the `vector` type create.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        # Wait until postgres is ready before test steps run.
        # See https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.9

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint package
        run: bun run lint:check

      - name: Build and test packed packages
        run: bun run test:package

      - name: Typecheck package
        run: bun run types

      - name: Typecheck repository with TypeScript 6
        run: bun run types:ts6

      - name: Test under Bun
        run: bun run test

      - name: Test Bun SQL on its minimum supported version
        run: mise exec bun@1.4.4 -- bun test packages/db/tests/bun-sql.test.ts

      - name: Test under Node.js
        run: bun run test:node

      - name: Build docs
        run: bun run docs:build
